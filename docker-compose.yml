services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stochastiq
      POSTGRES_PASSWORD: stochastiq
      POSTGRES_DB: stochastiq
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stochastiq -d stochastiq"]
      interval: 2s
      timeout: 5s
      retries: 30

  # One-shot demo bootstrap. Rebuilds the exact same demo dataset every
  # `docker compose up`: real CISA KEV/FIRST EPSS data if the container has
  # internet, the frozen fixture in app/data/fixtures/ if it doesn't (see
  # scripts/demo_bootstrap.py), so api/dashboard never race an empty
  # database and the demo needs no internet access at all.
  init:
    build: .
    command: python scripts/demo_bootstrap.py
    environment:
      DATABASE_URL: postgresql+psycopg://stochastiq:stochastiq@db:5432/stochastiq
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://stochastiq:stochastiq@db:5432/stochastiq
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      init:
        condition: service_completed_successfully

  dashboard:
    build: .
    command: streamlit run dashboard/Home.py --server.address 0.0.0.0
    environment:
      DATABASE_URL: postgresql+psycopg://stochastiq:stochastiq@db:5432/stochastiq
    ports:
      - "8501:8501"
    depends_on:
      init:
        condition: service_completed_successfully

volumes:
  db_data:
